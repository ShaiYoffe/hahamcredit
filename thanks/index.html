<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFE9F3">
<title>חכם קרדיט — פנייתך התקבלה</title>
<meta name="description" content="פנייתך התקבלה בהצלחה. נציג יחזור אליך בהקדם.">
<meta name="robots" content="noindex,follow">
<link rel="canonical" href="https://hahamcredit.com/thanks/">
<link rel="icon" type="image/png" href="/assets/logo.png">
<link rel="apple-touch-icon" href="/assets/logo.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bellefair&family=Heebo:wght@400;500;700;800&display=swap" rel="stylesheet">

<style>
:root {
  --blush:       #FFE9F3;
  --blush-2:     #FFD9E9;
  --paper:       #FFFFFF;
  --magenta:     #FF1493;
  --magenta-dk:  #A00A60;
  --wine:        #5C0533;
  --ink:         #1F0B2A;
  --ink-soft:    #4A2843;
  --ink-mute:    #8A6E80;
  --hairline:    #F4CCDC;
  --hairline-2:  #E89BBC;
  --serif: 'Bellefair', 'David Libre', 'Times New Roman', serif;
  --sans: 'Heebo', system-ui, sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { min-height: 100%; }
body {
  font-family: var(--sans);
  font-weight: 400;
  color: var(--ink);
  background: var(--blush);
  font-size: 16px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}

.thank-shell {
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: space-between;
  padding: 32px 22px 36px;
  text-align: center;
}

.brand {
  display: inline-flex;
  align-items: center;
  gap: 14px;
  text-decoration: none;
  color: var(--ink);
  line-height: 1;
}
.brand-mark {
  width: 56px; height: 56px;
  background: url('/assets/logo.png') center/68% no-repeat, var(--paper);
  border: 2px solid var(--ink);
  border-radius: 999px;
  box-shadow: 3px 3px 0 var(--ink);
  flex-shrink: 0;
}
.brand-wordmark {
  font-family: var(--serif);
  font-size: 28px;
  letter-spacing: -0.02em;
  color: var(--ink);
}
.brand-tagline {
  display: block;
  font-family: var(--sans);
  font-weight: 500;
  font-size: 11px;
  color: var(--ink-mute);
  letter-spacing: .08em;
  margin-top: 4px;
}

.thank-card {
  position: relative;
  max-width: 560px;
  margin: 40px auto;
  background: var(--paper);
  border: 2px solid var(--ink);
  border-radius: 0;
  padding: 56px 38px 42px;
  box-shadow: 8px 8px 0 var(--magenta);
  animation: fadeIn .5s cubic-bezier(.22, 1, .36, 1) both;
}
@keyframes fadeIn {
  from { opacity: 0; transform: translate(8px, 8px); }
  to   { opacity: 1; transform: translate(0, 0); }
}

.stamp-tag {
  position: absolute;
  top: -20px;
  inset-inline-start: 30px;
  background: var(--magenta);
  color: var(--paper);
  padding: 6px 16px;
  font-family: var(--serif);
  font-size: 15px;
  letter-spacing: .06em;
  border: 2px solid var(--ink);
  box-shadow: 3px 3px 0 var(--ink);
  z-index: 2;
}

.check-orb {
  width: 100px; height: 100px;
  margin: 0 auto 26px;
  background: var(--paper);
  border: 3px solid var(--ink);
  border-radius: 999px;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  box-shadow: 4px 4px 0 var(--magenta);
}
.check-orb svg { display: block; position: relative; z-index: 1; }

h1 {
  font-family: var(--serif);
  font-weight: 400;
  font-size: clamp(34px, 5vw, 54px);
  line-height: 1.0;
  letter-spacing: -0.022em;
  margin-bottom: 18px;
  color: var(--ink);
}
h1 em {
  font-style: italic;
  color: var(--magenta);
}

.thank-card p {
  font-family: var(--sans);
  font-size: 16px;
  color: var(--ink-soft);
  line-height: 1.65;
  max-width: 38ch;
  margin: 0 auto;
  font-weight: 400;
}

.next-strip {
  margin-top: 32px;
  border-top: 1px solid var(--ink);
  padding-top: 22px;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
}
.next-step {
  text-align: center;
}
.next-step .n {
  font-family: var(--serif);
  font-weight: 400;
  font-size: 30px;
  color: var(--magenta);
  letter-spacing: -0.02em;
  line-height: 1;
  display: block;
  margin-bottom: 6px;
}
.next-step .t {
  font-family: var(--sans);
  font-size: 12.5px;
  color: var(--ink-soft);
  font-weight: 600;
  line-height: 1.35;
  display: block;
}

.thank-foot {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  font-family: var(--serif);
  font-size: 13px;
  color: var(--ink-mute);
  letter-spacing: .04em;
}
.thank-foot a {
  color: var(--magenta-dk);
  text-decoration: none;
  border-bottom: 1px solid var(--hairline-2);
  padding-bottom: 1px;
}
.thank-foot a:hover { color: var(--magenta); border-color: var(--magenta); }

@media (max-width: 540px) {
  .thank-shell { padding: 26px 18px; }
  .brand-mark { width: 46px; height: 46px; box-shadow: 2px 2px 0 var(--ink); }
  .brand-wordmark { font-size: 24px; }
  .thank-card { padding: 44px 24px 32px; margin: 30px auto; box-shadow: 5px 5px 0 var(--magenta); }
  .check-orb { width: 80px; height: 80px; box-shadow: 3px 3px 0 var(--magenta); }
  .next-step .n { font-size: 24px; }
  .next-step .t { font-size: 11.5px; }
}
</style>

<div class="thank-shell">
  <a href="/" class="brand" aria-label="חכם קרדיט — חזרה לדף הבית">
    <span class="brand-mark" aria-hidden="true"></span>
    <span>
      <span class="brand-wordmark">חכם קרדיט</span>
      <span class="brand-tagline">— הלוואה חכמה לכל מטרה —</span>
    </span>
  </a>

  <main class="thank-card">
    <span class="stamp-tag">פנייה נקלטה</span>
    <div class="check-orb" aria-hidden="true">
      <svg width="46" height="46" viewBox="0 0 32 32" fill="none">
        <path d="M8 16.5 L13.5 22 L24 11" stroke="#FF1493" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <h1>תודה! פנייתך <em>התקבלה.</em></h1>
    <p>נציג מחכם קרדיט יחזור אליך בהקדם עם הצעה מותאמת אישית — מבית הגוף הפיננסי הנכון עבורך.</p>

    <div class="next-strip" aria-hidden="true">
      <div class="next-step">
        <span class="n">01</span>
        <span class="t">בדיקת הפרטים</span>
      </div>
      <div class="next-step">
        <span class="n">02</span>
        <span class="t">התאמת הצעה</span>
      </div>
      <div class="next-step">
        <span class="n">03</span>
        <span class="t">שיחה מנציג</span>
      </div>
    </div>
  </main>

  <footer class="thank-foot">
    <span>© חכם קרדיט — כל הזכויות שמורות</span>
    <span><a href="/privacy-policy/" rel="noopener">תנאי שימוש ומדיניות פרטיות</a></span>
  </footer>
</div>

</html>
