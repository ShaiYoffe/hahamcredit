<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0A12">
<title>חכם קרדיט — פנייתך התקבלה</title>
<meta name="description" content="פנייתך התקבלה בהצלחה. נציג יחזור אליך בהקדם.">
<meta name="robots" content="noindex,follow">
<link rel="canonical" href="https://hahamcredit.com/thanks/">
<link rel="icon" type="image/png" href="/assets/logo.png">
<link rel="apple-touch-icon" href="/assets/logo.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@500;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

<style>
:root {
  --bg-0:        #0A0A12;
  --bg-1:        #14141F;
  --bg-card:     #16162A;
  --hairline:    rgba(255, 255, 255, .08);
  --hairline-2:  rgba(255, 255, 255, .14);
  --magenta:     #FF1493;
  --magenta-dk:  #D10E76;
  --magenta-lt:  #FF4DAB;
  --magenta-glow: rgba(255, 20, 147, .55);
  --cyan:        #00E5FF;
  --ink-100:     #FFFFFF;
  --ink-200:     #E6E8EE;
  --ink-300:     #C4C7D6;
  --ink-400:     #8B90A8;
  --ink-500:     #5D6280;
  --mono: 'JetBrains Mono', ui-monospace, 'Courier New', monospace;
  --sans: 'Heebo', system-ui, sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { min-height: 100%; }
body {
  font-family: var(--sans);
  font-weight: 400;
  color: var(--ink-200);
  background: var(--bg-0);
  font-size: 16px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
  position: relative;
}
body::before {
  content: "";
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(rgba(255, 255, 255, .03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255, 255, 255, .03) 1px, transparent 1px),
    radial-gradient(ellipse 60% 35% at 80% 20%, var(--magenta-glow), transparent 60%),
    radial-gradient(ellipse 40% 25% at 10% 90%, rgba(0, 229, 255, .12), transparent 60%);
  background-size: 32px 32px, 32px 32px, 100% 100%, 100% 100%;
  pointer-events: none;
  z-index: 0;
}

.thank-shell {
  position: relative;
  z-index: 1;
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: space-between;
  padding: 32px 22px 36px;
  text-align: center;
}

.brand {
  display: inline-flex;
  align-items: center;
  text-decoration: none;
  line-height: 0;
}
.brand-logo {
  height: 50px;
  width: auto;
  display: block;
  filter: drop-shadow(0 0 10px var(--magenta-glow)) brightness(0) invert(1);
}

.thank-card {
  position: relative;
  max-width: 560px;
  margin: 36px auto;
  background: var(--bg-card);
  border: 1px solid var(--hairline-2);
  border-radius: 12px;
  padding: 50px 36px 38px;
  box-shadow:
    0 0 0 1px rgba(255, 20, 147, .12),
    0 24px 60px -16px rgba(0, 0, 0, .55),
    0 0 80px -16px rgba(255, 20, 147, .35);
  animation: fadeIn .6s cubic-bezier(.22, 1, .36, 1) both;
}
.thank-card::before {
  content: "";
  position: absolute;
  top: -1px;
  inset-inline-start: 24px;
  inset-inline-end: 24px;
  height: 2px;
  background: linear-gradient(90deg, transparent 0%, var(--magenta) 50%, transparent 100%);
  box-shadow: 0 0 12px var(--magenta-glow);
}
.thank-card::after {
  content: "";
  position: absolute;
  top: 10px;
  inset-inline-end: 10px;
  width: 14px; height: 14px;
  border: 1px solid var(--magenta);
  border-bottom: 0;
  border-left: 0;
  opacity: .8;
}
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(16px); }
  to   { opacity: 1; transform: translateY(0); }
}

.status-tag {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: rgba(255, 20, 147, .1);
  color: var(--magenta-lt);
  border: 1px solid rgba(255, 20, 147, .3);
  padding: 6px 13px;
  font-family: var(--mono);
  font-weight: 500;
  font-size: 11px;
  letter-spacing: .14em;
  text-transform: uppercase;
  margin-bottom: 28px;
}
.status-tag::before {
  content: "";
  width: 7px; height: 7px;
  background: var(--magenta);
  border-radius: 999px;
  box-shadow: 0 0 8px var(--magenta-glow);
  animation: blink 1.6s infinite;
}
@keyframes blink { 50% { opacity: .4; } }

.check-orb {
  position: relative;
  width: 100px; height: 100px;
  margin: 0 auto 26px;
  background: var(--bg-0);
  border: 2px solid var(--magenta);
  border-radius: 999px;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 0 0 4px rgba(255, 20, 147, .12), 0 0 32px var(--magenta-glow), inset 0 0 20px rgba(255, 20, 147, .15);
}
.check-orb::before {
  content: "";
  position: absolute;
  inset: -10px;
  border: 1px dashed rgba(255, 20, 147, .35);
  border-radius: 999px;
  animation: spin 22s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.check-orb svg { display: block; position: relative; z-index: 1; }

h1 {
  font-family: var(--sans);
  font-weight: 900;
  font-size: clamp(28px, 4.4vw, 38px);
  line-height: 1.12;
  letter-spacing: -0.025em;
  margin-bottom: 14px;
  color: var(--ink-100);
}
h1 em {
  font-style: normal;
  background: linear-gradient(135deg, var(--magenta) 0%, var(--magenta-lt) 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

.thank-card p {
  font-size: 16.5px;
  color: var(--ink-300);
  line-height: 1.6;
  max-width: 40ch;
  margin: 0 auto;
  font-weight: 400;
}

.next-strip {
  margin-top: 30px;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}
.next-step {
  background: rgba(255, 255, 255, .04);
  border: 1px solid var(--hairline-2);
  border-radius: 8px;
  padding: 14px 10px;
  text-align: center;
}
.next-step .n {
  font-family: var(--mono);
  font-weight: 500;
  font-size: 14px;
  color: var(--magenta-lt);
  letter-spacing: .05em;
  display: block;
  margin-bottom: 6px;
}
.next-step .t {
  font-size: 12px;
  color: var(--ink-200);
  font-weight: 600;
  line-height: 1.35;
  display: block;
}

.thank-foot {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  font-family: var(--mono);
  font-size: 11.5px;
  color: var(--ink-500);
  letter-spacing: .04em;
}
.thank-foot a {
  color: var(--magenta-lt);
  text-decoration: none;
  border-bottom: 1px solid rgba(255, 20, 147, .25);
  padding-bottom: 1px;
}
.thank-foot a:hover { color: var(--magenta); border-color: var(--magenta); }

@media (max-width: 540px) {
  .thank-shell { padding: 26px 18px; }
  .brand-logo { height: 40px; }
  .thank-card { padding: 40px 22px 30px; margin: 24px auto; }
  .check-orb { width: 80px; height: 80px; }
  .next-step .t { font-size: 11px; }
}
</style>

</head>

<div class="thank-shell">
  <a href="/" class="brand" aria-label="חכם קרדיט — חזרה לדף הבית">
    <img src="/assets/logo-wordmark.png" alt="חכם קרדיט" class="brand-logo">
  </a>

  <main class="thank-card">
    <span class="status-tag">PROCESS // 200_OK · נקלט</span>
    <div class="check-orb" aria-hidden="true">
      <svg width="44" height="44" viewBox="0 0 32 32" fill="none">
        <path d="M8 16.5 L13.5 22 L24 11" stroke="#FF1493" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <h1>פנייתך <em>נקלטה.</em></h1>
    <p>נציג מחכם קרדיט יחזור אליך בהקדם עם הצעה מותאמת אישית — מבית הגוף הפיננסי הנכון עבורך.</p>

    <div class="next-strip" aria-hidden="true">
      <div class="next-step">
        <span class="n">// 01</span>
        <span class="t">בדיקת פרטים</span>
      </div>
      <div class="next-step">
        <span class="n">// 02</span>
        <span class="t">סקירה חכמה</span>
      </div>
      <div class="next-step">
        <span class="n">// 03</span>
        <span class="t">שיחה מנציג</span>
      </div>
    </div>
  </main>

  <footer class="thank-foot">
    <span>© hahamcredit.com — all rights reserved</span>
    <span><a href="/privacy-policy/" rel="noopener">תנאי שימוש ומדיניות פרטיות</a></span>
  </footer>
</div>

</body>
